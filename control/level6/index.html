<!DOCTYPE html>
<html lang="en">
<head>
<title>Ring Court testing</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/acme-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/acme.css">
</head>
<body class="acme-game">
<div id="container">
  <h1>Level 6. The next level will start within:</h1>
  <div id="clockdiv">
    <div>
      <span class="minutes"></span>
      <div class="smalltext">Minutes</div>
    </div>
    <div>
      <span class="seconds"></span>
      <div class="smalltext">Seconds</div>
    </div>
  </div>
  <div id="court">
    <canvas id="canvas" width="720" height="720" role="img" aria-label="Ring Court game">
      <div class="unsupported">Sorry, this game cannot be run because your browser does not support the &lt;canvas&gt; element</div>
    </canvas>
    <div id="instructions">
      <b>Press spacebar</b> or <b>click</b> to start<br>
      <b>move the paddle around the ring with the mouse or the arrow keys</b>
    </div>
  </div>
</div>
<script src="../game/ringcourt.js" data-level="6" data-next="../level7/index.html"></script>
<script src="../../assets/js/acme-data.js"></script>
</body>
</html>
